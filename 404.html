<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3b56a">
  <title>Page not found — Pip &amp; Brain</title>
  <link rel="icon" type="image/png" href="assets-gate/brainpiplogo.png">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100vh; min-height: 100dvh; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #f9d6a5 0, #f3b56a 68%, #df9451 100%); color: #25170f; font-family: "Baloo 2", "Trebuchet MS", sans-serif; }
    .not-found { position: fixed; inset: 0; display: grid; place-items: center; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; isolation: isolate; }
    .not-found::before { content: ""; position: absolute; inset: -10%; z-index: -1; background: radial-gradient(ellipse at 50% 42%, #fff4d577, transparent 55%); animation: glow 3.8s ease-in-out infinite alternate; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 1; transition: opacity .45s ease; }
    .not-found.is-buffering video { opacity: 0; }
    .loading { position: absolute; inset-inline-start: 50%; bottom: calc(max(28px, env(safe-area-inset-bottom) + 18px) + 68px); display: flex; align-items: center; gap: 13px; width: max-content; max-width: calc(100% - 36px); padding: 12px 19px 12px 13px; border: 1px solid #fff9e7b8; border-radius: 999px; background: #fff9ecdd; box-shadow: 0 12px 32px #58301926, inset 0 1px 2px #fff; color: #372416; font: 700 16px/1.2 "Baloo 2", "Trebuchet MS", sans-serif; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .3s ease, transform .3s ease; backdrop-filter: blur(10px); }
    .is-buffering .loading { opacity: 1; transform: translate(-50%, 0); }
    .orbit { position: relative; display: block; width: 36px; height: 36px; flex: none; border: 2px solid #e8a5b8; border-top-color: #d94f7e; border-radius: 50%; animation: spin .8s linear infinite; }
    .orbit::after { content: ""; position: absolute; inset: 9px; border-radius: inherit; background: #f26a8c; box-shadow: 0 2px 5px #70374a33; }
    .back { position: absolute; z-index: 2; left: 50%; bottom: max(26px, calc(env(safe-area-inset-bottom) + 16px)); min-height: 58px; width: min(84vw, 300px); aspect-ratio: 900 / 223; display: inline-flex; align-items: center; justify-content: center; border: 0; padding: 8px 26px 14px; background: url("brain/assets/button-cream.webp") center / 100% 100% no-repeat; color: #432d20; filter: drop-shadow(0 8px 5px #58301935); font: 800 clamp(16px, 2.2vw, 20px)/1.1 "Baloo 2", "Trebuchet MS", sans-serif; text-decoration: none; text-align: center; white-space: nowrap; transform: translateX(-50%); transition: transform .22s ease, filter .22s ease; }
    .back:hover { transform: translate(-50%, -3px); filter: drop-shadow(0 12px 7px #5830193d) brightness(1.025); }
    .back:active { transform: translate(-50%, 2px); filter: drop-shadow(0 3px 2px #58301930); }
    .back:focus-visible { outline: 3px solid #25170f; outline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow { to { transform: scale(1.1); opacity: .55; } }
    @media (max-width: 600px) { .loading { bottom: calc(max(22px, env(safe-area-inset-bottom) + 12px) + 62px); font-size: 15px; } .back { bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px)); min-height: 54px; width: min(86vw, 280px); } }
    @media (prefers-reduced-motion: reduce) { .not-found::before, .orbit { animation: none; } video, .loading, .back { transition-duration: .01ms; } }
  </style>
</head>
<body>
  <main class="not-found is-buffering" id="not-found" aria-busy="true">
    <h1 class="sr-only">404 — Page not found</h1>
    <video id="not-found-video" autoplay muted playsinline loop preload="auto" aria-hidden="true">
      <source src="brain/assets/404-pingpong.mp4" type="video/mp4">
    </video>
    <div class="loading" aria-live="polite"><span class="orbit" aria-hidden="true"></span><span id="loading-copy">Finding the right path…</span></div>
    <a class="back" href="./">Back to the gate</a>
  </main>
  <script>
    const frame = document.getElementById('not-found');
    const video = document.getElementById('not-found-video');
    video.addEventListener('playing', () => { frame.classList.remove('is-buffering'); frame.setAttribute('aria-busy', 'false'); });
    video.addEventListener('waiting', () => { frame.classList.add('is-buffering'); frame.setAttribute('aria-busy', 'true'); });
    video.addEventListener('stalled', () => { frame.classList.add('is-buffering'); frame.setAttribute('aria-busy', 'true'); });
    const showFallback = () => {
      document.getElementById('loading-copy').textContent = 'Page not found';
      frame.classList.remove('is-buffering');
      frame.setAttribute('aria-busy', 'false');
    };
    video.addEventListener('error', showFallback);
    video.play().catch(showFallback);
  </script>
</body>
</html>
