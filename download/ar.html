<html lang="ar" dir="rtl">
<head>

<body>
  <a class="language" href="index.html" lang="en" hreflang="en">English</a>

    <img class="cloud cloud-left" src="../brain/assets/cloud1.webp" alt="" aria-hidden="true">

        </div>
