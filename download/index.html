<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#559edc">
  <title>Download Brain for Android</title>
  <meta name="description" content="Brain is ready for Android. Download the app and make a little more room for life.">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/brain-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="download.css">
</head>
<body>
  <a class="language" href="ar.html" lang="ar" hreflang="ar">العربية</a>
  <main class="download-scene">
    <img class="cloud cloud-left" src="../brain/assets/cloud1.webp" alt="" aria-hidden="true">
    <img class="cloud cloud-right" src="../brain/assets/cloud2.webp" alt="" aria-hidden="true">
    <div class="download-content">
      <div class="brand-art">
        <img class="wordmark" src="../brain/assets/BRAIN_cutout.png" alt="Brain" width="1142" height="384" fetchpriority="high">
        <img class="mascot" src="../brain/assets/pose5.png" alt="Brain, your clay companion" width="560" height="723" fetchpriority="high">
      </div>
      <h1>Your phone, minus the brainrot.</h1>
      <p class="release-note">The Android app is here.</p>
      <a class="clay-button" href="https://github.com/Renoo-AI/brain/releases/download/app/brain.apk">Get Brain for Android</a>
      <div class="store-soon" aria-label="Coming soon to Google Play and the App Store">
        <div class="store-badge">
          <img class="store-icon play-icon" src="assets/google-play-logo.webp" alt="" aria-hidden="true" width="48" height="48">
          <span class="store-copy"><small>COMING SOON</small><strong>Google Play</strong></span>
        </div>
        <div class="store-badge">
          <img class="store-icon app-icon" src="assets/app-store-logo.png" alt="" aria-hidden="true" width="48" height="48">
          <span class="store-copy"><small>COMING SOON</small><strong>App Store</strong></span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
