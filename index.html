<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets-gate/brainpiplogo.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <title>Pip &amp; Brain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
      --font-hand: "Caveat", "Segoe Script", cursive;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #f3b56a;
      color: #1e120c;
    }

    @media (min-width: 700px) {
      html, body { height: 100%; overflow: hidden; }
    }

    a { cursor: pointer; }

    .home {
      position: relative;
      isolation: isolate;
      min-height: 100dvh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(22px, 3.8vh, 52px) clamp(24px, 4.5vw, 72px) clamp(28px, 5.5vh, 64px);
      overflow: hidden;
    }

    .home::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-color: #f4b56b;
      background-image: url("assets-gate/bg.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
    }

    .hero h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(40px, 6vw, 88px);
      line-height: 0.92;
      letter-spacing: -0.03em;
      color: #1e120c;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand-word { position: relative; display: inline-block; }

    .title-ticks {
      position: absolute;
      right: -0.34em;
      top: -0.04em;
      width: 0.55em;
      height: 0.48em;
      pointer-events: none;
    }

    .title-ticks i {
      position: absolute;
      display: block;
      height: 0.085em;
      border-radius: 999px;
      background: #f26a3d;
    }

    .title-ticks i:nth-child(1) {
      width: 0.22em;
      left: 0;
      top: 0.06em;
      transform: rotate(62deg);
    }

    .title-ticks i:nth-child(2) {
      width: 0.28em;
      left: 0.2em;
      top: 0.22em;
      transform: rotate(28deg);
    }

    .tagline {
      margin: 0.12em 0 0 0.08em;
      max-width: 14em;
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: clamp(26px, 2.7vw, 42px);
      line-height: 1.05;
      color: rgba(30, 18, 12, 0.8);
      transform: rotate(-3deg);
      transform-origin: left center;
      animation: rise 0.8s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: min(1000px, 100%);
      margin-inline: auto;
      margin-bottom: clamp(8px, 2.5vh, 28px);
    }

    .card {
      background: rgba(255, 251, 247, 0.92);
      border-radius: 36px;
      padding: 22px 22px 18px;
      box-shadow: 0 10px 26px rgba(72, 36, 18, 0.13);
      animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.45s ease;
    }

    .card-pip { animation-delay: 0.16s; }
    .card-brain { animation-delay: 0.28s; }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 34px rgba(72, 36, 18, 0.16);
    }

    .card-top {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      gap: 14px 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .icon-wrap { position: relative; width: 80px; height: 80px; }

    .icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .icon-circle svg { width: 44px; height: 44px; }
    .card-pip .icon-circle { background: #f6d3b4; }
    .card-brain .icon-circle { background: #f7c9d6; }

    .card h2 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(32px, 2.5vw, 44px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: #1e120c;
    }

    .card p {
      margin: 4px 0 0;
      max-width: 16em;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(16px, 1.25vw, 19px);
      line-height: 1.28;
      color: rgba(30, 18, 12, 0.75);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      width: 100%;
      min-height: 60px;
      padding: 12px 22px 14px;
      border-radius: 999px;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(20px, 1.7vw, 28px);
      line-height: 1;
      letter-spacing: -0.01em;
      text-decoration: none;
      transition: filter 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn .arrow {
      width: 0.9em;
      height: 0.9em;
      flex: none;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-pip { background: #f26a21; box-shadow: 0 5px 0 #c94e10; }
    .btn-brain { background: #e8527f; box-shadow: 0 5px 0 #c23362; }

    .card:hover .btn,
    .btn:hover { filter: brightness(1.06); }

    .card:hover .arrow,
    .btn:hover .arrow { transform: translateX(5px); }

    .card-pip:hover .arrow,
    .btn-pip:hover .arrow { transform: translateX(-5px); }

    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c94e10; }
    .btn-brain:active { box-shadow: 0 2px 0 #c23362; }

    .btn:focus-visible {
      outline: 3px solid #1e120c;
      outline-offset: 4px;
    }

    body.is-transitioning { overflow: hidden; }
    .brain-transition[hidden] { display: none !important; }
    .brain-transition {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(ellipse at 50% 40%, #f9d6a5 0, #f3b56a 68%, #df9451 100%);
      isolation: isolate;
    }
    .brain-transition::before { content: ""; position: absolute; inset: -10%; z-index: -1; background: radial-gradient(ellipse at 50% 42%, #fff4d577, transparent 55%); animation: loader-glow 3.8s ease-in-out infinite alternate; }
    .brain-transition video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 1;
      transition: opacity .45s ease;
    }
    .brain-transition.is-buffering video { opacity: 0; }
    .transition-loader {
      position: absolute;
      z-index: 2;
      inset-inline-start: 50%;
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px));
      display: flex;
      align-items: center;
      gap: 13px;
      width: max-content;
      max-width: calc(100% - 36px);
      padding: 12px 19px 12px 13px;
      border: 1px solid #fff9e7b8;
      border-radius: 999px;
      background: #fff9ecdd;
      box-shadow: 0 12px 32px #58301926, inset 0 1px 2px #fff;
      color: #372416;
      font: 700 16px/1.2 var(--font-display);
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
      backdrop-filter: blur(10px);
    }
    .brain-transition.is-buffering .transition-loader { opacity: 1; transform: translate(-50%, 0); }
    .loader-orbit {
      position: relative;
      display: block;
      width: 36px;
      height: 36px;
      flex: none;
      border: 2px solid #e8a5b8;
      border-top-color: #d94f7e;
      border-radius: 50%;
      animation: loader-spin .8s linear infinite;
    }
    .loader-orbit::after { content: ""; position: absolute; inset: 9px; border-radius: inherit; background: #f26a8c; box-shadow: 0 2px 5px #70374a33; }
    .transition-skip {
      position: absolute;
      z-index: 3;
      top: max(18px, calc(env(safe-area-inset-top) + 12px));
      inset-inline-end: max(18px, calc(env(safe-area-inset-right) + 12px));
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #fff9e7b8;
      border-radius: 999px;
      background: #fff9ecdf;
      color: #372416;
      font: 700 15px/1 var(--font-display);
      box-shadow: 0 6px 18px #58301920;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .transition-skip:focus-visible { outline: 3px solid #d6558c; outline-offset: 3px; }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
    @keyframes loader-glow { to { transform: scale(1.1); opacity: .55; } }
    @media (max-width: 600px) {
      .transition-loader { bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px)); font-size: 15px; }
      .transition-skip { top: max(12px, calc(env(safe-area-inset-top) + 8px)); inset-inline-end: max(12px, calc(env(safe-area-inset-right) + 8px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .brain-transition::before, .loader-orbit { animation-duration: 2.5s; }
      .brain-transition video, .transition-loader { transition-duration: .01ms; }
    }

    @media (max-width: 699px) {
      html, body { overflow-x: clip; }

      .home {
        height: auto;
        min-height: 100svh;
        min-height: 100dvh;
        overflow-x: clip;
        overflow-y: auto;
        justify-content: space-between;
        gap: 12px;
        padding:
          max(18px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
      }

      .home::before {
        position: fixed;
        background-position: center top;
      }

      .hero h1 { font-size: clamp(34px, 10vw, 48px); }
      .tagline { font-size: clamp(24px, 6.4vw, 32px); margin-top: 2px; }

      .cards {
        grid-template-columns: 1fr;
        width: 100%;
        gap: 12px;
        margin-top: auto;
        margin-bottom: 0;
      }

      .card { border-radius: 28px; padding: 16px 16px 14px; }
      .card-top { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
      .icon-wrap, .icon-circle { width: 64px; height: 64px; }
      .icon-circle svg { width: 36px; height: 36px; }
      .card h2 { font-size: 30px; }
      .card p { font-size: 15.5px; line-height: 1.3; }
      .btn { min-height: 52px; font-size: 20px; padding: 10px 18px 12px; }
    }

    @media (max-width: 699px) and (max-height: 740px) {
      .home { padding-top: 12px; padding-bottom: 12px; gap: 8px; }
      .hero h1 { font-size: 32px; }
      .tagline { font-size: 22px; }
      .card { padding: 12px 12px 10px; border-radius: 24px; }
      .card-top { grid-template-columns: 48px minmax(0, 1fr); margin-bottom: 8px; gap: 10px; }
      .icon-wrap, .icon-circle { width: 48px; height: 48px; }
      .icon-circle svg { width: 28px; height: 28px; }
      .card h2 { font-size: 24px; }
      .card p { font-size: 14px; margin-top: 2px; }
      .btn { min-height: 44px; font-size: 17px; box-shadow: 0 3px 0 #c94e10; }
      .btn-brain { box-shadow: 0 3px 0 #c23362; }
    }

    @keyframes rise {
      from { opacity: 0; translate: 0 18px; }
      to { opacity: 1; translate: 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero h1, .tagline, .card, .btn, .arrow { animation: none; transition: none; }
      .card:hover, .card:hover .arrow, .btn:hover .arrow { transform: none; }
    }
  </style>
</head>
<body>
  <main class="home">
    <header class="hero">
      <h1>
        Pip &amp;
        <span class="brand-word">
          Brain
          <span class="title-ticks" aria-hidden="true"><i></i><i></i></span>
        </span>
      </h1>
      <p class="tagline">
        Two apps. One home.<br />
        Pick what you need.
      </p>
    </header>

    <section class="cards" aria-label="Choose an app">
      <article class="card card-pip">
        <div class="card-top">
          <div class="icon-wrap">
            <div class="icon-circle">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <rect x="17" y="6" width="14" height="22" rx="7" fill="#F26A21" />
                <path d="M13.5 22.5a10.5 10.5 0 0 0 21 0" fill="none" stroke="#F26A21" stroke-width="3.4" stroke-linecap="round" />
                <path d="M24 33v6.5M17.5 39.5h13" fill="none" stroke="#F26A21" stroke-width="3.4" stroke-linecap="round" />
              </svg>
            </div>
          </div>
          <div class="card-copy">
            <h2>Pip</h2>
            <p>Quick voice capture for your tasks and memories.</p>
          </div>
        </div>
        <a class="btn btn-pip" href="pip/" data-loading-video="brain/assets/piploading.mp4">
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12H6M11 6.5 5.5 12 11 17.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Open Pip
        </a>
      </article>

      <article class="card card-brain">
        <div class="card-top">
          <div class="icon-wrap">
            <div class="icon-circle">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 7.5c-7 0-12.2 5.3-12.2 12.1 0 4.3 2.2 7.3 4.7 9.5 1.6 1.4 2.6 3.1 2.6 5v1.2h9.8v-1.2c0-1.9 1-3.6 2.6-5 2.5-2.2 4.7-5.2 4.7-9.5C36.2 12.8 31 7.5 24 7.5z" fill="none" stroke="#C73D6C" stroke-width="2.8" stroke-linejoin="round" />
                <path d="M20.2 37.2h7.6M21.2 41h5.6" fill="none" stroke="#C73D6C" stroke-width="2.8" stroke-linecap="round" />
                <path d="M24 16.5v6.2" fill="none" stroke="#C73D6C" stroke-width="2.6" stroke-linecap="round" />
              </svg>
            </div>
          </div>
          <div class="card-copy">
            <h2>Brain</h2>
            <p>Think, reflect and keep your ideas in mind.</p>
          </div>
        </div>
        <a class="btn btn-brain" href="brain/" data-loading-video="brain/assets/brainloading.mp4">
          Open Brain
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h14M13 6.5 18.5 12 13 17.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </article>
    </section>
  </main>
  <div class="brain-transition is-buffering" id="brain-transition" hidden aria-live="polite" aria-busy="true">
    <video id="brain-loading-video" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="transition-loader"><span class="loader-orbit" aria-hidden="true"></span><span id="transition-label">Opening Brain…</span></div>
    <button class="transition-skip" id="transition-skip" type="button">Skip</button>
  </div>
  <script>
    (() => {
      const transition = document.getElementById('brain-transition');
      const video = document.getElementById('brain-loading-video');
      const label = document.getElementById('transition-label');
      const skip = document.getElementById('transition-skip');
      let activeRedirect = null;
      video.addEventListener('playing', () => { transition.classList.remove('is-buffering'); transition.setAttribute('aria-busy', 'false'); });
      video.addEventListener('waiting', () => { transition.classList.add('is-buffering'); transition.setAttribute('aria-busy', 'true'); });
      video.addEventListener('stalled', () => { transition.classList.add('is-buffering'); transition.setAttribute('aria-busy', 'true'); });
      skip.addEventListener('click', () => activeRedirect && activeRedirect());
      document.querySelectorAll('[data-loading-video]').forEach(link => link.addEventListener('click', event => {
        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
        event.preventDefault();
        const destination = link.href;
        let redirected = false;
        const redirect = () => {
          if (redirected) return;
          redirected = true;
          window.location.assign(destination);
        };
        activeRedirect = redirect;
        video.pause();
        video.removeAttribute('src');
        video.load();
        transition.classList.add('is-buffering');
        transition.setAttribute('aria-busy', 'true');
        transition.hidden = false;
        label.textContent = link.classList.contains('btn-pip') ? 'Opening Pip…' : 'Opening Brain…';
        video.src = link.dataset.loadingVideo;
        video.load();
        video.addEventListener('ended', redirect, { once: true });
        video.addEventListener('error', redirect, { once: true });
        video.addEventListener('loadedmetadata', () => {
          const duration = Number.isFinite(video.duration) ? video.duration : 28;
          setTimeout(redirect, Math.min((duration + 2) * 1000, 30000));
        }, { once: true });
        setTimeout(redirect, 30000);
        video.play().catch(redirect);
      }));
    })();
  </script>
</body>
</html>
